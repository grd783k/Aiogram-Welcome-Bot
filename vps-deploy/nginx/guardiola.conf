# /etc/nginx/sites-available/guardiola
# Remplace TON_DOMAINE.com par ton vrai domaine ou IP

server {
    listen 80;
    server_name TON_DOMAINE.com www.TON_DOMAINE.com;

    # Redirige HTTP → HTTPS (décommenter après avoir configuré le certificat SSL)
    # return 301 https://$host$request_uri;

    # ── Mini App Telegram (/api/) ─────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Pas de cache pour index.html
        location ~* ^/api/(index\.html)?$ {
            proxy_pass         http://127.0.0.1:8080;
            add_header         Cache-Control "no-store, no-cache, must-revalidate";
            add_header         Pragma        "no-cache";
            expires            -1;
        }
    }

    # ── Health check ─────────────────────────────────────────────────────────
    location /api/healthz {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }
}

