<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Guardiola Farm 66</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Expand ASAP — avant même que le DOM soit prêt -->
  <script>
    try { window.Telegram.WebApp.ready(); } catch(_) {}
    try { window.Telegram.WebApp.expand(); } catch(_) {}
    // Plein écran natif (Bot API 8.0+) — contenu derrière la barre Telegram, bouton Fermer superposé
    try {
      var _tw = window.Telegram.WebApp;
      if (_tw.requestFullscreen && parseFloat(_tw.version) >= 8) _tw.requestFullscreen();
    } catch(_) {}
    // Bloque la fermeture par glissement vers le bas (Bot API 7.7+) — seul le bouton Fermer quitte la Mini App
    try {
      var _tw2 = window.Telegram.WebApp;
      if (_tw2.disableVerticalSwipes) _tw2.disableVerticalSwipes();
    } catch(_) {}
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      /* Telegram injecte --tg-viewport-height et le met à jour sur viewportChanged */
      height: var(--tg-viewport-height, 100dvh);
    }
    body {
      width: 100%;
      height: var(--tg-viewport-height, 100dvh);
      overflow: hidden;
      background: #000;
    }

    #splash {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      /* Hauteur pilotée par la variable Telegram — jamais de gap */
      height: var(--tg-viewport-height, 100dvh);
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.38s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    #splash.fade-out { opacity: 0; pointer-events: none; }

    #splash::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 48%,
        rgba(59, 130, 246, 0.06) 0%, transparent 100%);
      pointer-events: none;
    }

    .s-bienvenue {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 20px;
      font-weight: 200;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.82);
      text-shadow:
        0 0 18px rgba(59, 130, 246, 0.60),
        0 0 40px rgba(59, 130, 246, 0.20);
      margin-bottom: 28px;
      text-align: center;
      opacity: 0;
      animation: s-bienvenue-in 0.55s 0.05s ease forwards;
    }

    @keyframes s-bienvenue-in {
      0%   { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .s-logo-wrap { position: relative; margin-bottom: 56px; }

    .s-logo-halo {
      position: absolute;
      inset: -36px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.28) 0%, transparent 68%);
      animation: s-glow-pulse 2.4s ease-in-out infinite;
    }

    .s-logo-card {
      position: relative;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 56px rgba(59,130,246,0.18),
        0 0 18px rgba(59,130,246,0.10);
      opacity: 0;
      animation: s-logo-in 0.55s 0.05s cubic-bezier(0.34,1.56,0.64,1) forwards;
      overflow: hidden;
    }

    .s-logo-img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    /* fallback texte (masqué quand le logo charge) */
    .s-logo-text { display: none; flex-direction: column; align-items: center; }
    .s-logo-letter {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 42px; font-weight: 800; color: #3b82f6;
      letter-spacing: -1px; line-height: 1;
    }
    .s-logo-sub {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px; font-weight: 700; color: rgba(59,130,246,0.55);
      letter-spacing: 2.5px; margin-top: 3px;
    }

    .s-progress-section {
      width: min(268px, 80vw);
      display: flex; flex-direction: column; gap: 10px;
    }

    .s-top-row { display: flex; justify-content: space-between; align-items: center; }

    .s-label {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px; color: rgba(255,255,255,0.18); letter-spacing: 0.4px;
    }
    .s-pct {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px; font-weight: 600; color: #3b82f6;
      min-width: 34px; text-align: right;
    }

    .s-bar-track {
      height: 3px; background: rgba(255,255,255,0.07);
      border-radius: 999px; overflow: hidden;
    }
    .s-bar-fill {
      height: 100%; width: 0%; border-radius: 999px;
      background: linear-gradient(90deg, #1d4ed8, #3b82f6 50%, #93c5fd);
      background-size: 200% 100%;
      box-shadow: 0 0 12px rgba(59,130,246,0.65), 0 0 5px rgba(59,130,246,0.4);
    }
    .s-bar-fill.shimmer { animation: s-bar-shimmer 1.4s linear infinite; }

    .s-msg {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px; color: rgba(255,255,255,0.32);
      letter-spacing: 0.3px; text-align: center;
      min-height: 18px; transition: color 0.25s ease, opacity 0.18s ease;
    }
    .s-msg.welcome { color: rgba(255,255,255,0.60); }

    @keyframes s-logo-in {
      0%   { opacity: 0; transform: scale(0.80); }
      62%  { opacity: 1; transform: scale(1.07); }
      100% { opacity: 1; transform: scale(1.00); }
    }
    @keyframes s-glow-pulse {
      0%, 100% { opacity: 0.65; transform: scale(1.00); }
      50%       { opacity: 1.00; transform: scale(1.14); }
    }
    @keyframes s-bar-shimmer {
      0%   { background-position: 200% center; }
      100% { background-position: -200% center; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="s-bienvenue">Bienvenue</div>
    <div class="s-logo-wrap">
      <div class="s-logo-halo"></div>
      <div class="s-logo-card">
        <img class="s-logo-img" src="logo.webp" alt="Guardiola Farm 66"
             onerror="this.style.display='none';document.querySelector('.s-logo-text').style.display='flex';" />
        <div class="s-logo-text">
          <span class="s-logo-letter">G</span>
          <span class="s-logo-sub">66</span>
        </div>
      </div>
    </div>

    <div class="s-progress-section">
      <div class="s-top-row">
        <span class="s-label" id="s-label">Chargement</span>
        <span class="s-pct"  id="s-pct">0%</span>
      </div>
      <div class="s-bar-track">
        <div class="s-bar-fill" id="s-bar"></div>
      </div>
      <div class="s-msg" id="s-msg">Initialisation…</div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    var LOGO_DELAY_MS   = 280;
    var PROGRESS_MS     = 1600;
    var HOLD_MS         = 550;
    var FADE_MS         = 380;
    // URL de la Mini App réelle — ouverte après le splash
    var APP_URL         = 'https://www.guardiola66.com/login';

    var MESSAGES = [
      'Initialisation…',
      'Connexion sécurisée…',
      'Chargement du shop…',
      'Vérification des données…',
      'Finalisation…',
    ];

    // Prénom via Telegram WebApp
    var firstName = 'vous';
    try {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        firstName = tg.initDataUnsafe.user.first_name || firstName;
      }
    } catch (_) {}

    var splashEl = document.getElementById('splash');
    var barEl    = document.getElementById('s-bar');
    var pctEl    = document.getElementById('s-pct');
    var msgEl    = document.getElementById('s-msg');
    var labelEl  = document.getElementById('s-label');

    function redirect() {
      window.location.replace(APP_URL);
    }

    function endSplash() {
      splashEl.classList.add('fade-out');
      setTimeout(redirect, FADE_MS + 50);
    }

    function startProgress() {
      barEl.classList.add('shimmer');
      var startTime    = null;
      var lastMsgIndex = -1;

      function tick(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        var pct = Math.min(100, Math.floor((elapsed / PROGRESS_MS) * 100));

        barEl.style.width = pct + '%';
        pctEl.textContent = pct + '%';

        var msgIdx = Math.min(Math.floor(pct / 20), MESSAGES.length - 1);
        if (msgIdx !== lastMsgIndex) {
          lastMsgIndex = msgIdx;
          msgEl.style.opacity = '0';
          setTimeout(function () {
            msgEl.textContent = MESSAGES[msgIdx];
            msgEl.style.opacity = '1';
          }, 100);
        }

        if (pct < 100) {
          requestAnimationFrame(tick);
        } else {
          barEl.classList.remove('shimmer');
          labelEl.textContent = 'Prêt ✓';

          // Haptic feedback Telegram
          try {
            if (tg && tg.HapticFeedback) {
              tg.HapticFeedback.notificationOccurred('success');
            }
          } catch (_) {}

          // Message de bienvenue
          setTimeout(function () {
            msgEl.classList.add('welcome');
            msgEl.style.opacity = '0';
            setTimeout(function () {
              msgEl.textContent = '👋 Bienvenue, ' + firstName;
              msgEl.style.opacity = '1';
            }, 120);
            setTimeout(endSplash, HOLD_MS);
          }, 80);
        }
      }

      requestAnimationFrame(tick);
    }

    // ready() et expand() ont déjà été appelés dans <head> — on re-force expand() ici
    // au cas où le script aurait été exécuté avant que le WebApp soit initialisé
    try { if (tg) { tg.ready(); tg.expand(); } } catch (_) {}

    // Mettre à jour la hauteur à chaque changement de viewport (iPhone : clavier, rotation…)
    try {
      if (tg) {
        tg.onEvent('viewportChanged', function () {
          try { tg.expand(); } catch (_) {}
          if (tg.viewportHeight) {
            document.documentElement.style.setProperty(
              '--tg-viewport-height', tg.viewportHeight + 'px'
            );
          }
        });
      }
    } catch (_) {}

    setTimeout(startProgress, LOGO_DELAY_MS);
  })();
  </script>
</body>
</html>
