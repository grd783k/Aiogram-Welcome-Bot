<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Wheat/leaf accent top-left -->
  <g opacity="0.7">
    <path d="M18 14 Q16 10 20 9 Q19 13 22 14 Q18 14 18 18 Q14 17 15 13 Q18 14 18 14Z" fill="#22c55e" opacity="0.6"/>
  </g>
  <!-- Wheat/leaf accent top-right -->
  <g opacity="0.7">
    <path d="M46 14 Q48 10 44 9 Q45 13 42 14 Q46 14 46 18 Q50 17 49 13 Q46 14 46 14Z" fill="#22c55e" opacity="0.6"/>
  </g>

  <!-- G letterform -->
  <text
    x="32"
    y="35"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="26"
    font-weight="700"
    fill="#22c55e"
    letter-spacing="-1"
  >G</text>

  <!-- 66 subtitle -->
  <text
    x="32"
    y="48"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Arial Narrow', Arial, sans-serif"
    font-size="8"
    font-weight="700"
    fill="#22c55e"
    fill-opacity="0.55"
    letter-spacing="3"
  >66</text>

  <!-- Thin horizontal rule between G and 66 -->
  <line x1="22" y1="40" x2="42" y2="40" stroke="#22c55e" stroke-width="0.5" stroke-opacity="0.25"/>
</svg>
